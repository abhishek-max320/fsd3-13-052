<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BrightPath Tuition</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #f8fafc;
            color: #1e293b;
        }

        /* NAVBAR */
        header {
            background: white;
            padding: 18px 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #2563eb;
        }

        .logo i {
            margin-right: 8px;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #334155;
            font-weight: 500;
            transition: 0.3s;
        }

        nav a:hover {
            color: #2563eb;
        }

        .menu-btn {
            display: none;
            font-size: 25px;
            cursor: pointer;
            color: #2563eb;
        }

        /* HERO */
        .hero {
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 70px 8%;
            background: linear-gradient(135deg, #eff6ff, #ffffff);
            gap: 50px;
        }

        .hero-content {
            max-width: 650px;
        }

        .tagline {
            color: #2563eb;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .hero h1 {
            font-size: 56px;
            line-height: 1.15;
            margin-bottom: 20px;
            color: #0f172a;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.8;
            color: #64748b;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
        }

        .primary-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .secondary-btn {
            border: 2px solid #2563eb;
            color: #2563eb;
            background: white;
        }

        .secondary-btn:hover {
            background: #2563eb;
            color: white;
        }
